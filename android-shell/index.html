<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MaQuincaillerie</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        background: #f7f9fc;
        color: #134e8e;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      strong {
        display: block;
        font-size: 19px;
        margin-bottom: 10px;
      }
      p {
        max-width: 34ch;
        margin: 0;
        font-size: 14px;
        line-height: 1.55;
        color: #374151;
      }
    </style>
  </head>
  <body>
    <!--
      Page de repli de l'emballage Android (§38).

      Elle ne s'affiche que lorsque le serveur ne répond pas : l'APK charge
      autrement l'application hébergée. Elle dit la même chose que l'écran de
      coupure de l'application — le gérant sait qu'il ne sait pas, plutôt que de
      lire un chiffre périmé.
    -->
    <div>
      <strong>MaQuincaillerie</strong>
      <p>
        Impossible de joindre le serveur. Vérifiez votre connexion, puis rouvrez
        l’application. Rien n’est perdu.
      </p>
    </div>
  </body>
</html>

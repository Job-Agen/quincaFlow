name: Repair restored units branch

on:
  push:
    branches:
      - fix/restore-product-units-wholesale
    paths:
      - scripts/fix-closures.mjs
      - .github/workflows/repair-restore-units.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-product-units-wholesale
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Restore closure validation
        run: node scripts/fix-closures.mjs
      - name: Format modified source
        run: npx prettier --write src/local/ledger.js src/local/forms.jsx scripts/fix-closures.mjs
      - name: Run tests
        run: npm test -- --runInBand || npm test
      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/local/ledger.js src/local/forms.jsx scripts/fix-closures.mjs
          git diff --cached --quiet || git commit -m "fix: restore closure validation with product units"
          git push
